# --- LDBC SNB Interactive SF1 ------------------------------------------------
#
# The canonical social-network benchmark. Used by E3 for the 14 Interactive
# complex reads, which double as a correctness benchmark: LDBC publishes official
# Cypher and SQL implementations of the same 14 queries, so a second engine
# running the Cypher unmodified reconstructs the reference answers LDBC does not
# distribute (they are generated by their Java driver).
