# --- GIST-1M (TEXMEX/INRIA), mirrored on the Hub -------------------------------
#
# A second ANN corpus with a deliberately different shape from SIFT: 960-d GIST
# descriptors rather than 128-d SIFT, and 1,000 queries rather than 10,000. Used
# to test whether a `refine_factor` policy generalises across dimensionality and
# distribution rather than being fitted to one dataset.
#
#   base    1_000_000 x (4 + 960*4) = 3_844_000_000
#   query       1_000 x (4 + 960*4) =     3_844_000
#   gt          1_000 x (4 + 100*4) =       404_000
#
# The mirror declares **no license**, and upstream TEXMEX/INRIA publishes neither
# a license nor a checksum. These digests pin this mirror and nothing more; see
