# Benchmark fixtures too large to commit, pinned by digest.
#
# Every entry is fetched and verified by `scripts/fixtures/fetch.py`. Read
# `docs/fixtures.md` before adding one.
#
# The three rules that make a pin mean something:
#
#   1. `revision` is a 40-hex commit sha, never a branch. A branch moves, which
#      turns a pinned digest into a spurious failure and makes a published
#      benchmark number unreproducible.
#   2. `digest` is what the *Hub publishes* for that path at that revision --
#      `lfs.oid` (sha256) for LFS-backed files, the git blob sha1 for small
#      plain ones. Generate an entry with
#      `fetch.py --emit-entry REPO PATH --revision SHA` rather than by hand, and
#      re-assert it with `fetch.py --check-upstream`.
#   3. Nothing here is optional. A missing digest is a hard error, not an
#      unverified download.

schema = 1

