# --- SIFT-1M (TEXMEX/INRIA), mirrored on the Hub ---------------------------
#
# The canonical ANN benchmark corpus. Byte sizes are structurally exact and are
# asserted by the consumer, not merely recorded:
#
#   base   1_000_000 x (4 + 128*4) =   516_000_000
#   query     10_000 x (4 + 128*4) =     5_160_000
#   gt        10_000 x (4 + 100*4) =     4_040_000
#
# A file of the right length in the wrong slot -- query pinned as base, say --
# cannot survive that arithmetic, which is why the reader recomputes it rather
# than trusting the manifest's `bytes`.
#
# Provenance note: upstream is TEXMEX at INRIA, served over FTP, which publishes
# no checksum of its own. These digests pin *this Hub mirror*, which is the
# strongest honest claim available -- see docs/fixtures.md, "What verified
# means". The mirror declares apache-2.0.

