# cargo-deny — supply-chain policy.
#
# Until 2026-08-13 no supply-chain gate existed at all. The first run found 24
# advisories, of which 10 were vulnerabilities or unsoundness. Three were fixed
# outright by an in-semver `cargo update` (anyhow, crossbeam-epoch, lru); the
# rest are pinned by upstream and are listed below with the reason and the
# version that will clear them.
#
# # The policy, and why it is shaped this way
#
# `vulnerability` and `unsound` DENY. Those are the classes worth stopping a PR
# for, and the ignore list below is the honest record of the ones we cannot act
# on -- each with a named blocker, so the entry can be re-tested rather than
# rotting into permanent silence.
#
# `unmaintained` and `yanked` WARN. Seven of the original 24 were unmaintained
# crates (bincode, bitmaps, fxhash, im-rc, number_prefix, paste,
# proc-macro-error2). Six were transitive and not actionable here; fxhash was
# the exception — ours, declared directly — and has since been migrated to
# `rustc-hash` (#174), leaving only its transitive copy. Denying them
# would have made the gate red on day one, and a gate that is red on day one
# gets disabled rather than fixed -- which buys nothing and costs the
# vulnerability coverage too.

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"

ignore = [
  # ---- lance-io -> opendal -> {quick-xml, reqsign-azure-storage -> rsa} ----
  # Reachable only through object-store paths. Clearing these needs an opendal
  # bump inside lance, which this repo pins via `lance`; not actionable here.
  # Re-test on every lance upgrade.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 via lance-io->opendal-core; needs >=0.41.0, opendal-pinned. DoS (quadratic attribute check) on XML we do not parse directly." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4 via lance-io->opendal-core; needs >=0.41.0, opendal-pinned. Namespace-allocation DoS, same reachability." },
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 via lance-io->opendal->reqsign-azure-storage. Marvin timing attack; upstream states NO safe upgrade exists. Only reachable on Azure blob auth." },

  # ---- candle-core 0.10 -> zip 7.2 ----
  # Patched only in zip >= 9.0.0. candle-core 0.10.2 requires zip "^7.2.0" and
  # even the newest candle-core (0.11.0) requires "^8.6.0", so no candle release
  # reaches a patched zip; candle-core is pinned at 0.10 here and transitively by
  # mistralrs 0.8 / uni-xervo. Re-test on every candle / mistralrs upgrade.
  # Exposure, verified 2026-10-19: all three advisories are in the *extraction*
  # API (`ZipArchive::extract`, `ZipStreamReader::extract`). candle-core only
  # opens archives with `ZipArchive::new` and reads named entries (npz/pth tensor
  # loading in npy.rs / pickle.rs); neither candle-*, mistralrs-* nor uni-xervo
  # calls `extract`, and no uni crate depends on zip directly.
  { id = "RUSTSEC-2026-0367", reason = "zip 7.2.0 via candle-core 0.10.2 (zip ^7.2; candle 0.11 still ^8.6), patched only in >=9.0.0. SUID/SGID bits preserved by extract(); we never call extract()." },
  { id = "RUSTSEC-2026-0368", reason = "zip 7.2.0 via candle-core 0.10.2, patched only in >=9.0.0. extract() creates symlinks escaping the destination; we never call extract()." },
  { id = "RUSTSEC-2026-0369", reason = "zip 7.2.0 via candle-core 0.10.2, patched only in >=9.0.0. extract() applies Unix permissions through symlinks; we never call extract()." },

  # The extism -> wasmtime 43 block (RUSTSEC-2026-0149/0182/0188/0222/0269/
  # 0314/0316/0321/0322/0323/0327) was here and is gone: extism 1.41.0 moved to
  # wasmtime 49, and wasmtime/wasmtime-wasi 49.0.3 are patched for all of them
  # plus 0352/0359/0362/0363 (2026-10-19). uni-plugin-wasm moved to 49.0.3 in
  # the same change (VERSION SYNC in both plugin Cargo.toml files). 49.0.4
  # (2026-10-20) fixes RUSTSEC-2026-0378/0379; the floor moved with it.
  #
  # RUSTSEC-2025-0057 (fxhash, unmaintained) was here and is gone (#174).
  #
  # The migration to `rustc-hash` removed fxhash as a *workspace-direct*
  # dependency, and `unmaintained = "workspace"` above scopes this check to
  # exactly that — so the advisory no longer fires at all. fxhash is still in the
  # tree transitively, through `biodivine-lib-bdd`, which is not ours to change
  # and which the policy deliberately does not ask about.
  #
  # The entry is deleted rather than kept as a comment: an ignore list that
  # records advisories no longer in scope stops being readable as the set of
  # things still owed.
]

[licenses]
version = 2
# Deliberately explicit rather than a blanket allow: an unrecognised license
# appearing in the tree should be a decision, not a silent pass.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  # Added 2026-08-13 after the first run rejected them. All OSI-permissive; each
  # was checked rather than blanket-allowed.
  "BlueOak-1.0.0",   # permissive, plain-language (ripgrep-family crates)
  "bzip2-1.0.6",     # the bzip2 license, BSD-like
  "NCSA",            # University of Illinois/NCSA, BSD+MIT-equivalent
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"   # a 500-crate graph with lance+datafusion+candle
                              # always carries duplicates; denying is noise.
wildcards = "deny"            # `version = "*"` in a manifest IS actionable...
allow-wildcard-paths = true   # ...except on path deps, where it is how this
                              # workspace's internal crates refer to each other
                              # (uni-tck, uni-locy-tck, uni-locy-oracle). Those
                              # are not published with a wildcard; the version
                              # is resolved from the path.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
