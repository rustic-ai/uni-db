[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "uni-db"
dynamic = ["version"]
description = "Python bindings for Uni Graph Database (default — all 11 providers, CPU)"
authors = [
    { name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://www.rustic.ai"
Documentation = "https://rustic-ai.github.io/uni-db"
Repository = "https://github.com/rustic-ai/uni-db"
Issues = "https://github.com/rustic-ai/uni-db/issues"

[project.optional-dependencies]
docs = [
    "pdoc>=14.0.0",
]
# Runtime deps for the flagship neural-predicate notebooks. CI's flagship
# verifier job installs these. They're opt-in so the default uni-db wheel
# stays lean.
notebook-runtime = [
    "onnxruntime>=1.18",
    "pyarrow>=16",
    "numpy>=1.26",
]
# Prep-time-only deps for the flagship neural-predicate notebook data
# pipeline. Used by scripts under website/scripts/prepare_*.py to train
# embeddings + export ONNX. NEVER imported from notebook or library code.
notebook-data-prep = [
    "torch>=2.2",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "scikit-learn>=1.4",
    "pyarrow>=16",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.25.0",
    "patchelf>=0.17",
    "pytest-xdist>=3.8.0",
    # Required by tests/test_repro_arrow_double_free.py, a Critical Arrow-FFI
    # double-free regression guard whose child process imports pyarrow. Declared
    # here so `uv sync --group dev` (what CI runs) makes the guard executable
    # rather than silently error on a missing import.
    "pyarrow>=16",
    # Required by tests/test_stateful_crud.py, the model-based state machine.
    # Declared here so `uv sync --group dev` (what CI runs) makes it executable
    # rather than collect-error on a missing import.
    "hypothesis>=6.100",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.maturin]
module-name = "uni_db._uni_db"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
