[package]
name = "uni-python-onnx"
description = "Python bindings for Uni graph database (ONNX + remote-API variant; no candle)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_uni_db"
crate-type = ["cdylib"]
path = "../uni-db/src/lib.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
# Slim variant: ONNX local provider (raw, rerank, embed tasks via the
# unified xervo 0.9.0 local/onnx) plus the 8 hosted APIs and llama.cpp. Opts
# out of uni-db's default-everything to exclude candle;
# keeps wheel size down for users who only need embeddings/reranking +
# remote LLMs.
uni-db = { workspace = true, default-features = false, features = [
    "lance-backend",
    "mimalloc",
    # Plugin loaders the shared binding source calls unconditionally.
    # `rhai-plugins` is in uni-db's default set, but this variant uses
    # `default-features = false`, so both it and `pyo3-plugins` (always
    # opt-in) must be re-listed explicitly or the wheel fails to compile.
    "rhai-plugins",
    "pyo3-plugins",
    "provider-onnx",
    "provider-openai",
    "provider-gemini",
    "provider-vertexai",
    "provider-mistral",
    "provider-anthropic",
    "provider-voyageai",
    "provider-cohere",
    "provider-azure-openai",
    "provider-llamacpp",
] }
uni-locy = { workspace = true }
uni-common = { workspace = true }
uni-store = { workspace = true }
uni-plugin = { workspace = true }
uni-plugin-rhai = { workspace = true }
uni-plugin-pyo3 = { workspace = true, features = ["pyo3"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[features]
# This slim variant intentionally omits the WASM/Extism plugin loaders (no
# wasmtime/extism deps). The shared `../uni-db/src/lib.rs` source still
# references these cfgs, so declare them as empty (off-by-default, no deps) to
# satisfy `unexpected_cfgs` under `-D warnings` — the gated methods compile out.
wasm-plugins = []
extism-plugins = []
