# Pull Request Workflow
#
# Cheap, fast verification for pull requests — the gates a contributor must
# pass before merge: format, lint, the workspace test suite, one representative
# openCypher TCK lane, and the Python binding tests.
#
# The thorough/expensive remainder (sidecar + Locy TCK, reranker, cloud,
# cargo doc, flagship notebooks, the WASM/Extism loader lane, release guards,
# cuda smoke) runs ONCE on push to main in ci.yml and is deliberately NOT
# repeated here. This is safe because
# branch protection requires PR branches to be up to date with main before
# merging, so these gates run against the exact tree that will land on main.

name: PR Checks

on:
  pull_request:
    branches: [main]

# Cancel superseded runs when a PR branch is pushed again.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Format and lint checks
  lint:
    if: github.repository == 'rustic-ai/uni-db'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Wheel-matrix accelerator variants don't fit on the regular CI
      # runner: metal variants pull in `objc2` (Apple-only); cuda variants
      # pull in `cudarc` whose build.rs requires `nvcc`. They're built in
      # dedicated `release-wheels.yml` jobs with the right container/runner.
      - name: Run clippy
        run: |
          cargo clippy --workspace \
            --exclude uni-tck \
            --exclude uni-python-cuda \
            --exclude uni-python-metal \
            --exclude uni-python-onnx-cuda \
            --exclude uni-python-onnx-metal \
            --all-targets -- -D warnings

  # Supply-chain policy. Until 2026-08-13 no such gate existed, and the first
  # run found 24 advisories — 10 of them vulnerabilities or unsoundness. Three
  # were fixed outright by an in-semver `cargo update`; the rest are pinned
  # upstream and carry a documented, blocker-named exception in `deny.toml`.
  #
  # Cheap and dependency-graph-only: no build, no `mold`/`protobuf`, and it does
  # not touch the shared cargo build cache, so it adds a lane rather than
  # lengthening the critical path.
  supply-chain:
    if: github.repository == 'rustic-ai/uni-db'
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned: cargo-deny ships new advisory *checks*, so an unpinned install
      # would let the same commit pass today and fail tomorrow with no change to
      # this repo. Bump deliberately, alongside re-testing `deny.toml`'s ignores.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked

      # All four checks in one invocation so the summary line reports each:
      # `advisories ok, bans ok, licenses ok, sources ok`.
      - name: cargo deny check
        run: cargo deny check

  # Fuzz smoke — 30 s/target instead of the nightly 5 min.
  #
  # The nightly job is the one that finds *new* bugs; this one exists so a
  # parser or codec regression fails the PR that introduces it rather than
  # surfacing a day later, when it is no longer obvious which change caused it.
  #
  # Seed-corpus first, and that is the load-bearing part at 30 s: a fresh
  # libFuzzer run spends most of half a minute rediscovering basic structure,
  # whereas `fuzz/seeds/<target>` holds inputs that previously crashed — e.g.
  # `btic_decode/utf8-boundary-bce-suffix`, the multi-byte UTF-8 case that
  # panicked `strip_bce_suffix` (fixed 2026-06-10). Replaying those is a real
  # regression check; 30 s of blind mutation mostly is not.
  fuzz-smoke:
    if: github.repository == 'rustic-ai/uni-db'
    name: Fuzz Smoke (parsers & codecs)
    runs-on: ubuntu-xlarge
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (nightly, for libfuzzer)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-fuzz
        # Explicit `tool:` form, not the `@cargo-fuzz` shorthand — see the
        # nightly job for why the shorthand can leave `cargo fuzz` uninstalled.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache fuzz build
        uses: Swatinem/rust-cache@v2
        with:
          # Shares the nightly job's cache key: same fuzz workspace, same
          # targets, so a PR run warms from (and warms) the same artifacts.
          shared-key: "fuzz"
          workspaces: fuzz
          cache-on-failure: true

      - name: Run fuzz targets (30 s each, seed-corpus first)
        working-directory: fuzz
        # `--target x86_64-unknown-linux-gnu` is load-bearing — see the nightly
        # job's comment: without it a musl-built cargo-fuzz statically links
        # libc, which AddressSanitizer rejects outright.
        run: |
          for target in cypher_parse locy_parse wal_decode btic_decode; do
            echo "::group::fuzz $target"
            # Corpus-dir order is load-bearing. libFuzzer writes newly-discovered
            # inputs into the FIRST directory listed and treats the rest as
            # read-only. So `corpus/$target` must come first: naming
            # `seeds/$target` first makes the curated, git-tracked seed corpus
            # the output dir, and a single 30 s run buries its handful of
            # regression inputs under a few hundred generated files.
            mkdir -p "corpus/$target"
            seeds=""
            # Only some targets have a seed dir, and a missing path makes
            # libFuzzer error rather than skip it.
            [ -d "seeds/$target" ] && seeds="seeds/$target"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
              "$target" "corpus/$target" $seeds -- -max_total_time=30 -timeout=10
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Miri (UB interpreter) — the three crates whose suites fit in seconds.
  #
  # This is NOT here to police our own `unsafe`: these crates contain none. The
  # only `unsafe` token across all four is a string literal inside an error
  # message (crates/uni-common/src/core/schema.rs:1419). What miri checks is UB
  # reached THROUGH dependencies as our call patterns exercise them — the
  # pointer and aliasing work inside object_store, tokio, rmp-serde, chrono —
  # plus leaks. The leak check is the part that has already paid: it found a
  # `std::mem::forget(TempDir)` that leaked a directory on disk once per test
  # run, forever (crates/uni-common/tests/repro_rename_property_bypass.rs:19-27).
  #
  # `uni-crdt` is deliberately not here — 40 minutes for its lib tests alone,
  # because it pulls in uni-plugin. It runs nightly, as the long fuzz tier does.
  # `muvera` is excluded outright rather than budgeted: its tests were KILLED at
  # 132 minutes. It has grown since that measurement, so the number only moves
  # the wrong way.
  #
  # Measured 2026-08-22 on a 22-core box, warm, exactly as the steps below run:
  # 1 min 41 s for all three. That is more than the 31 s recorded when the lane
  # was first priced, and the gap is scope rather than drift — that measurement
  # was `--lib` only for two of the three crates, while these steps also run
  # `--tests`. Included deliberately: the integration target is where miri found
  # the TempDir leak. If this passes ~5 min, drop `--tests` from uni-common
  # before touching the timeout.
  #
  # `cargo miri test`, NOT nextest — the documented exception to CLAUDE.md's
  # nextest rule. Nextest runs a process per test and each one pays a fresh
  # interpreter + std startup; these suites are only affordable because all
  # their tests share one interpreted process.
  miri:
    if: github.repository == 'rustic-ai/uni-db'
    name: Miri (UB interpreter)
    runs-on: ubuntu-xlarge
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # PINNED, and the only pinned toolchain in the repo — deliberately.
      # `fuzz-smoke` can ride `@nightly` because cargo-fuzz is a crates.io
      # binary that always installs. `miri` is a rustup COMPONENT, and it is not
      # built for every nightly, so an unpinned lane goes red on a random day
      # for reasons unrelated to the PR — on the branch-protection side of the
      # fence. Miri's -Z flag surface also churns faster than anything else we
      # run.
      #
      # Bump deliberately, and keep it in sync with nightly.yml's miri job: the
      # two share the "miri" cache key, so a mismatch makes each run rebuild the
      # other's sysroot. Pick a date that has `miri` at
      # https://rust-lang.github.io/rustup-components-history.
      - name: Setup Rust (pinned nightly + miri)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-11
          components: miri, rust-src

      # miri interprets our crates, but build scripts and proc macros are still
      # compiled and LINKED natively, so mold (required by .cargo/config.toml's
      # linux rustflags) is not optional here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Its own key, for the reason "tsan" has one: a different toolchain
          # and a different build mode mean nothing in "ci" is reusable, and
          # writing miri's artifacts into "ci" would only evict entries the
          # stable jobs need. Shared with nightly.yml's miri job — same crates,
          # same pinned toolchain — so a PR run warms from and warms the same
          # artifacts, exactly as fuzz-smoke does.
          shared-key: "miri"
          # rust-cache knows nothing about ~/.cache/miri, where `cargo miri
          # setup` puts the interpreted sysroot; without this, every run
          # rebuilds it. The key already includes the rustc version, so a
          # toolchain bump invalidates it correctly.
          cache-directories: "~/.cache/miri"
          cache-on-failure: true

      # Its own step on purpose: this is what breaks when a nightly ships a
      # broken or missing component, and separating it means that failure reads
      # as "toolchain", not "we found UB".
      - name: Build the miri sysroot
        run: cargo +nightly-2026-07-11 miri setup

      # Isolation stays ON here. These two are pure codecs — no clock, no
      # filesystem, no environment — so they do not need the weakening applied
      # to uni-common below, and keeping it that way means a new syscall
      # dependency in a codec crate surfaces as a miri error instead of passing
      # silently.
      #
      # `--lib --tests` is explicit rather than left to the default. The budget
      # was measured on these targets; leaving the scope implicit means the next
      # `tests/*.rs` file silently joins a PR-blocking lane.
      - name: Miri — codecs (isolation ON)
        env:
          PROPTEST_CASES: "16"
        run: |
          echo "::group::miri uni-btic"
          cargo +nightly-2026-07-11 miri test -p uni-btic --lib --tests 2>&1 | tee -a miri.log
          echo "::endgroup::"
          echo "::group::miri uni-sparse-vector"
          cargo +nightly-2026-07-11 miri test -p uni-sparse-vector --lib --tests 2>&1 | tee -a miri.log
          echo "::endgroup::"

      # -Zmiri-disable-isolation is scoped to THIS step, and it is load-bearing
      # twice over: uni-common calls `Utc::now()` throughout the schema/fork/
      # snapshot paths, and tests/repro_rename_property_bypass.rs:29-33 builds a
      # real LocalFileSystem over a tempdir. Under isolation both abort the run
      # rather than fail a test. The cost is that miri no longer proves these
      # tests are hermetic — which is exactly why the flag is not on the step
      # above.
      #
      # The trailing `::` in `--skip 'muvera::'` is load-bearing. libtest's
      # --skip is a plain substring match over the full test path, and the bare
      # `muvera` form also swallows
      # `vector_index_opts::tests::muvera_defaults_and_inner` — a test in a
      # different module that merely has the word in its name. Measured: bare
      # removes 14, anchored removes exactly the 13 in the module. muvera's
      # tests are inline (crates/uni-common/src/muvera.rs) so they list as
      # `muvera::tests::*`; there is no separate target to exclude with -p or
      # --test.
      - name: Miri — uni-common minus muvera (isolation OFF)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          echo "::group::miri uni-common (--skip muvera)"
          cargo +nightly-2026-07-11 miri test -p uni-common --lib --tests \
            -- --test-threads=1 --skip 'muvera::' 2>&1 | tee -a miri.log
          echo "::endgroup::"

      # The log IS the triage input — a miri report is a full interpreter
      # backtrace through dependency frames, and the web UI truncates scrollback.
      - name: Upload miri log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miri-log
          path: miri.log
          if-no-files-found: ignore

  # Rust tests — the workspace suite (the core signal contributors gate on).
  rust-tests:
    if: github.repository == 'rustic-ai/uni-db'
    name: Rust Tests
    runs-on: ubuntu-xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      # The uni-plugin-extism / uni-plugin-wasm e2e tests load pre-built
      # WASM plugin artifacts (see scripts/build-wasm-fixtures.sh); build
      # them before the workspace test run or those tests panic.
      - name: Build WASM plugin fixtures
        run: ./scripts/build-wasm-fixtures.sh

      - name: Run tests
        # `uni-python` (bindings/uni-db) and `uni-python-onnx` are
        # cdylib-only crates with zero Rust `#[test]` items — their tests
        # are pytest in the python-tests job. We exclude them from the
        # workspace cargo test because their `pyo3/extension-module` feature
        # unifies with `uni-plugin-pyo3`'s test binaries and breaks the
        # linker (no libpython linkage in extension-module mode).
        run: |
          cargo nextest run --workspace \
            --exclude uni-tck \
            --exclude uni-python \
            --exclude uni-python-onnx \
            --exclude uni-python-cuda \
            --exclude uni-python-metal \
            --exclude uni-python-onnx-cuda \
            --exclude uni-python-onnx-metal

  # Concurrency model check — fast loom smoke over the OCC commit core. Catches
  # regressions to the write-write / read-write conflict-detection logic
  # (crates/uni-store/src/runtime/occ.rs) on the PR that introduces them. The
  # exhaustive 3-committer model + shuttle run nightly (nightly.yml model-check).
  loom-smoke:
    if: github.repository == 'rustic-ai/uni-db'
    name: Concurrency Model Check (loom smoke)
    runs-on: ubuntu-xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      # Bounded preemptions keep the smoke fast; nightly raises it to 3. Must run
      # ONLY --test occ_model (other suites drive real Writers whose loom atomics
      # panic outside a model).
      - name: loom (exhaustive, bounded preemptions)
        env:
          LOOM_MAX_PREEMPTIONS: 2
        run: cargo nextest run -p uni-store --features loom --test occ_model

      # The GraphCompute handle trace is env-switched and always compiled. Its
      # in-process tests force it on directly, so they run in the main suite; this
      # step additionally exercises the real `UNI_GC_TRACE` path end-to-end, which
      # is otherwise never taken by any job.
      - name: GraphCompute handle trace (UNI_GC_TRACE)
        env:
          UNI_GC_TRACE: "1"
        run: cargo nextest run -p uni-plugin-builtin -p uni-plugin-rhai -E 'test(graph_compute)'

  # Metamorphic query-correctness smoke — the TLP + NoREC oracles
  # (crates/uni/tests/common/metamorphic/) at a small case budget, catching
  # silent-wrong-answer regressions (pushdown drops, three-valued-logic bugs) on
  # the PR that introduces them. The high-volume soak runs nightly
  # (nightly.yml metamorphic). Only the non-ignored smoke tests run here.
  metamorphic-smoke:
    if: github.repository == 'rustic-ai/uni-db'
    name: Metamorphic Query Oracles (smoke)
    runs-on: ubuntu-xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      # Runs the non-ignored smoke tier; METAMORPHIC_CASES governs the per-test
      # case count (default 64). The targeted teeth/non-vacuity tests run too.
      - name: Metamorphic smoke (TLP + NoREC)
        env:
          METAMORPHIC_CASES: 64
        run: |
          cargo nextest run -p uni-db --test integration \
            -E 'test(/metamorphic::/) and not test(soak)'

  # openCypher conformance on PRs — the schemaless lane only (the fast,
  # representative mode). The sidecar mode and the Locy TCK lanes run on the
  # main-push CI (ci.yml). Without this, a PR breaking Cypher conformance lands
  # green and only fails post-merge.
  tck:
    if: github.repository == 'rustic-ai/uni-db'
    name: openCypher TCK (schemaless)
    runs-on: ubuntu-xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true
          save-if: false

      - name: Run openCypher TCK (schemaless)
        run: cargo nextest run -p uni-tck --test tck

  # Python bindings tests — ruff + pytest for both bindings (high-signal,
  # shifted left onto the PR). The 6 flagship-notebook executions are heavier
  # and run on the main-push CI (ci.yml), not here.
  python-tests:
    if: github.repository == 'rustic-ai/uni-db'
    name: Python Tests
    runs-on: ubuntu-xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      # Needed by the pyo3 loader step below. This is a Python job, so Rust is
      # otherwise only here for `maturin develop`, which needs plain `cargo
      # build` — nextest is a separate subcommand and is not part of the
      # toolchain.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Install Python dependencies (uni-db)
        working-directory: bindings/uni-db
        run: uv sync --group dev

      - name: Build Python bindings (uni-db)
        working-directory: bindings/uni-db
        run: uv run maturin develop

      - name: Check Python formatting (uni-db)
        working-directory: bindings/uni-db
        run: uv run ruff format --check .

      - name: Lint Python code (uni-db)
        working-directory: bindings/uni-db
        run: uv run ruff check .

      - name: Run Python tests (uni-db)
        working-directory: bindings/uni-db
        run: uv run pytest tests/ -v -n auto

      # The `uni-plugin-pyo3` Rust tests only exist under `--features pyo3`, and
      # every one of its source files is `#![cfg(feature = "pyo3")]`. The
      # workspace run above uses default features (none), and the `uni-python*`
      # crates that would enable it are excluded for linker reasons — so without
      # this step those tests compile in no CI invocation at all and cannot fail.
      # They run here because this is the job that has a Python environment with
      # `pyarrow`, which the vectorized scalar path's guest bodies genuinely need.
      - name: Run pyo3 loader tests (Rust, --features pyo3)
        working-directory: bindings/uni-db
        run: |
          SITE=$(uv run python -c "import site; print(site.getsitepackages()[0])")
          echo "embedded interpreter will read: $SITE"
          PYTHONPATH="$SITE" cargo nextest run \
            --manifest-path ../../Cargo.toml \
            -p uni-plugin-pyo3 --features pyo3

      - name: Install Python dependencies (uni-pydantic)
        working-directory: bindings/uni-pydantic
        run: uv sync --group dev

      - name: Check Python formatting (uni-pydantic)
        working-directory: bindings/uni-pydantic
        run: uv run ruff format --check .

      - name: Lint Python code (uni-pydantic)
        working-directory: bindings/uni-pydantic
        run: uv run ruff check .

      - name: Run Python tests (uni-pydantic)
        working-directory: bindings/uni-pydantic
        run: uv run pytest tests/ -v -n auto
