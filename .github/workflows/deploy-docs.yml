name: Deploy Documentation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rustic-ai/uni-db'
    runs-on: ubuntu-xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Check initial disk space
        run: df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Build Rust crates (required by Python bindings and cargo doc)
      - name: Build Rust crates
        run: cargo build --release

      # Build and install Python bindings (notebooks need uni_db)
      - name: Build Python bindings
        run: |
          pip install maturin
          cd bindings/uni-db
          maturin build --release
          pip install ../../target/wheels/*.whl
          rm -rf ../../target/wheels  # Clean up wheels after install

      # Install uni-pydantic and its dependencies (pydantic notebooks need it)
      # uni-db requirement is satisfied by wheel installed above
      - name: Install uni-pydantic
        run: |
          pip install ./bindings/uni-pydantic

      # Runtime deps for the flagship neural-predicate notebooks executed below
      # (the `notebook-runtime` extra in bindings/uni-db/pyproject.toml). Kept
      # in sync with the same install in ci.yml / pr.yml.
      #
      # `onnxruntime` is held at 1.24.3, the version `bindings/uni-db/uv.lock`
      # resolves to under its temporary cap (see `[tool.uv]` in that
      # pyproject.toml for the reason). An open range here installed whatever
      # Microsoft published last, in a job that can write to Pages. Lift the
      # pin together with that cap.
      - name: Install flagship notebook runtime dependencies
        run: |
          pip install "numpy>=1.26" "pyarrow>=16" "onnxruntime==1.24.3"

      - name: Execute flagship Locy notebook (semiconductor)
        run: python website/scripts/verify_semiconductor_flagship_notebook.py

      - name: Execute flagship Locy notebook (pharma batch genealogy)
        run: python website/scripts/verify_pharma_flagship_notebook.py

      - name: Execute flagship Locy notebook (cyber exposure twin)
        run: python website/scripts/verify_cyber_flagship_notebook.py

      - name: Execute flagship Locy notebook (predictive maintenance)
        run: python website/scripts/verify_predictive_maintenance_flagship_notebook.py

      - name: Execute flagship Locy notebook (adverse drug reaction)
        run: python website/scripts/verify_adverse_drug_reaction_flagship_notebook.py

      - name: Execute flagship Locy notebook (drug-drug interaction)
        run: python website/scripts/verify_drug_drug_interaction_flagship_notebook.py

      # Clean up release artifacts to free disk space (keep wheels)
      - name: Clean up build artifacts
        run: |
          rm -rf target/release
          df -h

      # Install Zensical and all dependencies
      - name: Install documentation dependencies
        run: |
          pip install zensical pymdown-extensions nbconvert nbclient nbformat ipykernel pdoc

      # Convert Jupyter notebooks to Markdown (Zensical doesn't support mkdocs-jupyter)
      - name: Convert notebooks to Markdown
        run: python website/scripts/convert_notebooks.py

      # Build documentation with Zensical
      - name: Build Documentation
        run: |
          cd website
          zensical build

      # Build and copy API docs AFTER Zensical (since zensical cleans site/)
      - name: Build Rust documentation
        run: |
          cargo doc --no-deps --document-private-items \
            -p uni-db \
            -p uni-common \
            -p uni-query \
            -p uni-store \
            -p uni-algo \
            -p uni-crdt
          mkdir -p website/site/api/rust
          cp -r target/doc/* website/site/api/rust/

      - name: Build Python documentation
        run: |
          pdoc -o website/site/api/python uni_db uni_pydantic

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/site

  deploy:
    if: github.repository == 'rustic-ai/uni-db'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
