name: Nightly

# Nightly hardening lane (architecture review §6): the test tiers too slow
# or too specialized for PR/main pipelines.
#   - soak:  the #[ignore]'d long-running stress/soak tier, with the soak
#            knobs cranked to their documented nightly settings.
#   - cloud: LocalStack S3 integration (also on main-push CI; here for the
#            longer --run-ignored variants on a schedule).
#   - fuzz:  cargo-fuzz over the parser/codec attack surfaces.
#   - dqp:   the differential-query-plans oracle at volume — one query down two
#            execution paths, comparing result bags. Its own job because each
#            case costs two queries; see docs/perf/dqp-feasibility-2026-08-12.md.
#   - miri:  uni-crdt's lib tests under the miri interpreter — UB reached
#            through dependencies, plus leaks. 40 min measured, which is why it
#            is here and not in pr.yml (that lane runs the three cheap crates).
#   - bench: criterion benches with results uploaded as artifacts for
#            manual trend comparison (no external regression service).
#
# No untrusted input is interpolated into run commands (cron +
# workflow_dispatch only).

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least-privilege GITHUB_TOKEN: every job here only reads the repo, runs tests,
# and uploads artifacts (the artifact API does not use the contents scope), so
# read-only contents is sufficient. Mirrors ci.yml / pr.yml.
permissions:
  contents: read

# Runner targeting is indirected through the SAME repository variables as ci.yml
# so the pool can be cut over (and rolled back) for CI and Nightly together,
# without editing either file. The DEFAULT is GitHub-hosted: each falls back to
# this workflow's original GitHub-hosted label when its variable is unset, so
# this file is a behavioral no-op until you opt in. To move a tier onto the
# self-hosted aks-isolated-linux pool, set the variable to the self-hosted label
# (shown in parens) in Settings > Secrets and variables > Actions > Variables;
# to roll back, clear the variable.
#   CI_RUNNER_XLARGE64  default ubuntu-xlarge  → set to linux-64core  — soak, fuzz,
#                                                 model-check, metamorphic, dqp, tsan, miri, bench
# Note XLARGE64's GitHub-hosted default is ubuntu-xlarge here vs ci.yml's
# linux-xlarge-64 (preserving each workflow's pre-existing choice); the self-hosted
# target you'd set it to (linux-64core) is shared. The cloud job is NOT indirected:
# it is hardcoded to the GitHub-hosted linux-xlarge-32 (matches ci.yml) so its
# LocalStack S3 tests always run on GitHub infra even after the self-hosted cutover.
jobs:
  soak:
    if: github.repository == 'rustic-ai/uni-db'
    name: Soak & Stress (run-ignored)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true
          save-if: false

      - name: Build WASM plugin fixtures
        run: ./scripts/build-wasm-fixtures.sh

      - name: Run ignored soak/stress tier
        env:
          # Soak knobs calibrated to complete reliably within the job budget
          # (fork_writes_soak ~5 min; see fork_writes_soak.rs). The prior
          # 100/1000/10 ran well over 40 min and was killed by the per-test
          # timeout, so the soak never actually completed.
          UNI_FORK_SOAK_FORKS: 40
          UNI_FORK_SOAK_MUTATIONS: 300
          UNI_FORK_SOAK_RESTARTS: 4
          # Number of generated programs the Locy naive-oracle soak diffs against
          # the engine. ~10k completes in ~10-15 min (each case pays a full DB
          # build, which dominates); higher would risk the soak per-test kill
          # window. Dedicated var so it can't perturb other crates' PROPTEST_CASES.
          ORACLE_SOAK_CASES: 10000
        run: |
          # Scope to the actual soak/stress tests. `--run-ignored ignored-only`
          # alone also sweeps in unrelated #[ignore]'d tests (autoembed model
          # downloads needing HF auth, LocalStack e2e) that this job does not
          # provision — LocalStack has its own `cloud` job below.
          #
          # `not test(/dqp::/)` mirrors the metamorphic job below, and for the
          # same reason: every DQP soak's name contains "soak", so this filter
          # was matching all of them and running the `dqp` job's work a second
          # time — at the *default* 20 000 cases rather than the 10 000 that job
          # sets, inside a timeout sized for a different workload.
          cargo nextest run --profile soak -p uni-db -p uni-store -p uni-locy-oracle \
            --run-ignored ignored-only \
            -E '(test(/soak/) | test(/stress/)) and not test(/dqp::/)'

  cloud:
    if: github.repository == 'rustic-ai/uni-db'
    name: Cloud Integration (LocalStack)
    # Pinned to a GitHub-hosted runner (NOT the CI_RUNNER_* indirection): the
    # LocalStack S3 integration must run on GitHub infra regardless of the
    # self-hosted cutover, so setting CI_RUNNER_XLARGE32 to a self-hosted label
    # never moves this job.
    runs-on: linux-xlarge-32
    timeout-minutes: 60
    services:
      localstack:
        image: localstack/localstack:4.13.1
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true
          save-if: false

      - name: Wait for LocalStack
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1; do echo "Waiting for LocalStack..."; sleep 2; done'
          echo "LocalStack is ready!"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run cloud integration tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ALLOW_HTTP: true
        run: |
          cargo nextest run -p uni-store --test integration --run-ignored all \
            -E 'test(/^cloud_integration_test::/)'
          cargo nextest run -p uni-db --test integration --run-ignored all \
            -E 'test(/^hybrid_localstack_e2e::/)'

  fuzz:
    if: github.repository == 'rustic-ai/uni-db'
    name: Fuzz (parsers & codecs)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (nightly, for libfuzzer)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-fuzz
        # Use the explicit `tool:` form, not the `@cargo-fuzz` shorthand: the
        # shorthand can resolve to a version ref that drops the implicit tool
        # selection (install-action warns "no tool specified"), leaving
        # `cargo fuzz` uninstalled -> "no such command: fuzz".
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache fuzz build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fuzz"
          workspaces: fuzz
          cache-on-failure: true

      - name: Run fuzz targets (5 min each)
        working-directory: fuzz
        # `--target x86_64-unknown-linux-gnu` is load-bearing: cargo-binstall
        # now resolves the *musl*-built `cargo-fuzz` prebuilt, and cargo-fuzz
        # defaults `--target` to the triple it was itself compiled for. A musl
        # default makes the build statically link libc, which AddressSanitizer
        # rejects ("sanitizer is incompatible with statically linked libc") and
        # which has no sanitizer-ready prebuilt std ("can't find crate for
        # core"). Pin the runner's native gnu target (dynamic libc + prebuilt
        # instrumentable std) so the default never leaks in.
        run: |
          for target in cypher_parse locy_parse wal_decode btic_decode; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=300 -timeout=10
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  model-check:
    if: github.repository == 'rustic-ai/uni-db'
    name: Concurrency Model Check (loom + shuttle)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true
          save-if: false

      # Exhaustively model-checks the OCC commit core (write-write + read-write
      # conflict detection in crates/uni-store/src/runtime/occ.rs) over all
      # 2- and 3-committer interleavings. See src/occ_loom_model.rs. Must run
      # ONLY --test occ_model: other suites drive real Writers, whose loom
      # atomics panic outside a model.
      - name: loom (exhaustive, 2 & 3 committers)
        env:
          LOOM_MAX_PREEMPTIONS: 3
        run: cargo nextest run -p uni-store --features loom --test occ_model

      # Randomized scheduler over the same models — scales past loom's
      # exhaustive limit (10k iterations/model; reproducible by seed on failure).
      - name: shuttle (randomized)
        run: cargo nextest run -p uni-store --features shuttle --test occ_model

  metamorphic:
    if: github.repository == 'rustic-ai/uni-db'
    name: Metamorphic Query Oracles (TLP + NoREC)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true
          save-if: false

      # High-volume soak of the TLP + NoREC + structural query-correctness
      # oracles (crates/uni/tests/common/metamorphic/). Each soak test builds the
      # seed db ONCE and shares it read-only across all cases (see
      # metamorphic::drive), so per-case cost is just a few sub-millisecond reads.
      #
      # Budget sizing: the four soak tests run concurrently (wall-clock = slowest).
      # The heaviest is `structural` at ~7 queries/case; at 50k cases it runs
      # ~25 min, comfortably inside the soak profile's 40-min per-test kill
      # (.config/nextest.toml: 120s × terminate-after 20) with margin for CI
      # variance. 50k cases × (4+4+2+7) queries ≈ 850k metamorphic queries/night,
      # ~8.5× the Phase-1 exit target of ≥100k queries/night. The smoke tier runs
      # per-PR (pr.yml metamorphic-smoke); only the #[ignore]'d soaks run here.
      # `not test(/dqp::/)` — the DQP soak runs in its own job below, at its own
      # volume via DQP_CASES. Without the exclusion it would run twice.
      - name: Metamorphic soak (TLP + NoREC + structural)
        env:
          METAMORPHIC_CASES: 50000
        run: |
          cargo nextest run --profile soak -p uni-db --test integration \
            --run-ignored ignored-only \
            -E 'test(/metamorphic::/) and test(soak) and not test(/dqp::/)'

  # DQP — differential query plans. Separate from the metamorphic job above
  # because a single lever at nightly volume takes roughly as long as that job's
  # heaviest existing soak, and sharing would push it toward its 60-minute
  # ceiling. It also needs its own case-count knob: METAMORPHIC_CASES is pinned
  # to 50000 there for the other oracles, which is 2.5x the volume measured as
  # affordable for a lever that runs every case twice.
  dqp:
    if: github.repository == 'rustic-ai/uni-db'
    name: DQP Differential Oracle (soak)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true
          save-if: false

      # Each case runs the same query down two execution paths and compares the
      # result bags, so 10000 cases is 20000 queries per soak and 160000 across
      # the eight — comfortably past the >=100k-queries/night target on its own.
      #
      # Sized down from 20000 by measurement, not caution. At 20000 the four
      # soaks that existed then measured 85.4 minutes serial on a 22-core box,
      # and four heavy tests contending would have pushed the slowest toward this
      # job's 60-minute timeout.
      #
      # Re-measured after Phase 4 took the count from four soaks to eight, in
      # this exact configuration — all eight concurrently at DQP_CASES=10000 on
      # 22 cores: **29.9 minutes wall-clock**, slowest test 29.9 min against the
      # 54-minute per-test ceiling. So 10000 still holds, with margin, and this
      # box is more contended than the 64-core runner.
      #
      # Phase 5 added a ninth soak (`flush_pushdown_soak`), and it is **not**
      # included in the 29.9-minute figure above. Measured only at smoke volume:
      # 500 cases in 18 s, so 10000 extrapolates to roughly 6 minutes — well
      # inside the slowest test's 29.9, and these run concurrently, so the
      # wall-clock bound should be unchanged. That is an extrapolation, not a
      # measurement; if this job starts approaching the ceiling, re-measure the
      # set rather than assuming this line was right.
      #
      # The response to approaching a ceiling is to cut the volume or
      # investigate, not to raise the ceiling again.
      - name: DQP soak (four levers x plain, aggregate and pushdown cases)
        env:
          DQP_CASES: 10000
        run: |
          cargo nextest run --profile soak -p uni-db --test integration \
            --run-ignored ignored-only \
            -E 'test(/metamorphic::dqp::/) and test(soak)'

  tsan:
    if: github.repository == 'rustic-ai/uni-db'
    name: ThreadSanitizer (SSI commit path)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # build-std needs the nightly toolchain + rust-src to recompile std with
      # the sanitizer instrumentation.
      - name: Setup Rust (nightly + rust-src, for -Zbuild-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "tsan"
          cache-on-failure: true

      # Run the genuinely multi-threaded SSI suites (real tokio worker threads +
      # tokio::spawn) under ThreadSanitizer — the live async commit path the
      # loom/shuttle models (model-check job) structurally cannot reach. std is
      # rebuilt instrumented via -Zbuild-std so cross-thread sync inside std/tokio
      # is visible. The single-threaded ssi_occ_test (uni-store) is deliberately
      # excluded: no parallelism → no races to find.
      #
      # halt_on_error=0 collects every report into tsan.log (uploaded for triage);
      # exitcode=66 still fails the job on any non-suppressed race, so the lane
      # keeps teeth. Suppressions are scoped to known-benign FFI/parking_lot
      # frames only — never our own crates.
      # --test-threads 1 runs the test PROCESSES serially. Each SSI test already
      # spins its own multi-thread tokio runtime (8 workers) + spawned writers,
      # so TSan still sees full in-process cross-thread interleavings — serial
      # execution costs zero race coverage. Running two instrumented heavy
      # processes at once instead thrashes under TSan's 5-10x memory/CPU overhead
      # and stalls the MERGE retry-storm test past nextest's 180s ceiling. Serial
      # keeps every test ~1-4s, well inside the default slow-timeout.
      - name: ThreadSanitizer on the SSI suite
        env:
          RUSTC_WRAPPER: ""
          RUSTFLAGS: "-Zsanitizer=thread"
          PROPTEST_CASES: "16"
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.config/tsan-suppressions.txt:halt_on_error=0:exitcode=66:second_deadlock_stack=1:history_size=4"
        run: |
          cargo +nightly nextest run -Z build-std \
            --target x86_64-unknown-linux-gnu \
            -p uni-db --test integration \
            --test-threads 1 \
            -E 'test(/ssi_invariants::/) | test(/ssi_occ_e2e::/) | test(/ssi_stress::/)' \
            2>&1 | tee tsan.log

      # The log IS the triage input for tightening .config/tsan-suppressions.txt.
      - name: Upload ThreadSanitizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: tsan.log
          if-no-files-found: warn

  miri:
    if: github.repository == 'rustic-ai/uni-db'
    name: Miri (uni-crdt)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Pinned nightly — see pr.yml's miri job for why this one lane pins when
      # nothing else in the repo does. KEEP THE DATE IN SYNC WITH pr.yml: the
      # two share the "miri" cache key, and a mismatch means each run rebuilds
      # the other's sysroot and dependency tree.
      - name: Setup Rust (pinned nightly + miri)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-11
          components: miri, rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "miri"
          cache-directories: "~/.cache/miri"
          cache-on-failure: true

      - name: Build the miri sysroot
        run: cargo +nightly-2026-07-11 miri setup

      # uni-crdt is the crate that does not fit a PR. Measured 2026-08-22 on the
      # pinned toolchain: 45 min 22 s wall-clock for its 31 lib tests, clean —
      # no UB, no leaks. Worth knowing where that time goes: only 702 s (12 min)
      # is interpretation, and the other ~33 min is COMPILING uni-crdt and
      # uni-plugin under miri. So this job's cost is dominated by a cold cache
      # rather than by test volume, which is what the shared "miri" cache key
      # buys. It is slow to interpret because it depends on uni-plugin, so miri
      # walks the whole plugin dispatch path on the way to a CRDT merge. The timeout is
      # deliberate headroom for the crate growing, not room to add targets — if
      # this job approaches the ceiling, re-measure and cut the set rather than
      # raising it.
      #
      # `--lib` is load-bearing and NOT the default. The integration targets add
      # ~140 more tests, two dozen of them proptest properties that hardcode
      # `ProptestConfig::with_cases(100)`
      # (crates/uni-crdt/tests/common/crdt/merge_properties.rs). `with_cases` is
      # applied over `Config::default()` and therefore OVERRIDES PROPTEST_CASES,
      # so there is no knob to turn them down from here — thousands of property
      # cases through an interpreter is not a bounded run.
      #
      # Isolation stays ON: uni-crdt's only environmental dependency is
      # `Uuid::new_v4()`, and miri supplies randomness under isolation.
      - name: Miri on uni-crdt (lib tests)
        run: |
          cargo +nightly-2026-07-11 miri test -p uni-crdt --lib \
            -- --test-threads=1 2>&1 | tee miri.log

      - name: Upload miri log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miri-log
          path: miri.log
          if-no-files-found: warn

  bench:
    if: github.repository == 'rustic-ai/uni-db'
    name: Benchmarks (artifact upload)
    runs-on: ${{ vars.CI_RUNNER_XLARGE64 || 'ubuntu-xlarge' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold protobuf-compiler

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true
          save-if: false

      # A bench file with no `[[bench]]` stanza is auto-discovered by Cargo with
      # the DEFAULT libtest harness. If it calls `criterion_main!`, that main
      # becomes dead code, libtest finds zero `#[bench]` functions, and the run
      # reports "0 measured; ok". It does not fail -- it passes while measuring
      # nothing. `pushdown_performance.rs` did exactly that from the day it was
      # added until 2026-08-15.
      #
      # Note a build check CANNOT catch this: the file compiles fine. Only
      # comparing the file list against the declared stanzas does.
      - name: Every bench file must have a [[bench]] stanza
        run: |
          cd crates/uni
          comm -13 \
            <(grep -A1 '^\[\[bench\]\]' Cargo.toml | grep '^name' | cut -d'"' -f2 | sort) \
            <(ls benches/*.rs | xargs -n1 basename | sed 's/\.rs$//' | sort) \
          | tee /dev/stderr | (! grep -q .)

      # Only three benches are actually run below; this type-checks the rest, so
      # a declared bench that stops compiling is caught here rather than whenever
      # someone next runs it by hand.
      #
      # `check`, deliberately, not `cargo bench --benches --no-run`. Measured
      # 2026-08-16 on a warm 22-core box: the full bench build is **76m 08s**,
      # because each of the 19 targets statically links the whole
      # datafusion/lance/candle tree -- the same cost that caps integration-test
      # binaries at 3 per crate in docs/test_layout.md. That does not fit this
      # job's 90-minute budget alongside the benches it actually runs. `check` is
      # **50s** and catches compile errors in all 19; link errors are not covered,
      # and the three benches run below are the standing check on linking.
      - name: Type-check all bench targets
        run: cargo check -p uni-db --benches

      - name: Run commit/SSI benches
        run: |
          cargo bench -p uni-db --bench ssi_commit_overhead
          cargo bench -p uni-db --bench concurrent_mutations
          cargo bench -p uni-db --bench commit_throughput

      - name: Upload criterion results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}
          path: target/criterion/
          if-no-files-found: warn
