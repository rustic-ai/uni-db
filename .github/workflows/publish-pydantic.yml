# Publish uni-pydantic package to PyPI
#
# Builds and publishes the pure Python uni-pydantic package.
# Triggers automatically after uni-db wheels are published (since uni-pydantic depends on uni-db),
# or can be run manually.
# Uses OIDC trusted publishing for secure authentication.

name: Publish Pydantic

on:
  workflow_run:
    workflows: ["Publish Python"]
    types: [completed]

  workflow_dispatch:
    inputs:
      target:
        description: 'Target registry'
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  build:
    name: Build uni-pydantic
    runs-on: ubuntu-latest
    # Only auto-run after successful tag push releases from Publish Python,
    # or always on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build bindings/uni-pydantic

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-dist
          path: bindings/uni-pydantic/dist

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [build]
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: pydantic-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [build]
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: pydantic-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
