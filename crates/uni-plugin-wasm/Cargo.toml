[package]
name = "uni-plugin-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "WASM Component Model loader for the uni-db plugin framework"
keywords = ["plugin", "wasm", "wasmtime", "graph", "database"]
categories = ["database", "wasm"]

[dependencies]
uni-plugin = { workspace = true }
uni-plugin-wasm-rt = { workspace = true }
# GraphCompute kernel dispatch driven by guest WASM algorithms. No cycle:
# uni-plugin-builtin does not depend on this crate.
uni-plugin-builtin = { workspace = true }
uni-common = { workspace = true }
uni-algo = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-ipc = "58.3.0"
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
# Parse the component manifest's version string into the semver::Version that
# uni_plugin::PluginManifest requires (for load_as_plugin / conformance).
semver = "1.0"

# wasmtime is the heaviest dep; gated by the `wasmtime-runtime` feature so
# embedders that only want the trait surface (e.g., for compile-time
# Rust-only plugins via uni-plugin-builtin) can opt out.
#
# VERSION SYNC: keep wasmtime/wasmtime-wasi on the same major as the wasmtime
# pulled in by `extism` (crates/uni-plugin-extism) — a mismatch links two
# wasmtime copies into every uni-db binary. Bump all three together. The
# 49.0.4 floor is the first 49.x carrying the RUSTSEC-2026-0378/0379 fixes
# (49.0.3 carried 0352/0359/0362/0363).
wasmtime = { version = "49.0.4", default-features = false, features = ["runtime", "cranelift", "component-model"], optional = true }
wasmtime-wasi = { version = "49.0.4", optional = true }
datafusion = { workspace = true, optional = true }

[features]
default = ["wasmtime-runtime"]
wasmtime-runtime = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:datafusion"]

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true }
# `wat` assembles minimal valid component-model WASM from text for
# instantiation tests without committing binary fixtures.
wat = "1"
anyhow = { workspace = true }
arrow-array = { workspace = true }
datafusion = { workspace = true }
# Drives the shared conformance probe suite against a loaded component via the
# `load_as_plugin` bridge (tests/conformance_wasm.rs). No cycle: the conformance
# crate depends on uni-plugin, not on this loader.
uni-plugin-conformance = { workspace = true }

# Mode B-seq perf gate — the JIT'd-WASM arm (plugin-compute proposal §14 Q1 / Q-5).
# Lives here, not in uni-db's bench set, because it needs wasmtime and uni-db
# deliberately gates the wasmtime compile cost behind an opt-in feature.
[[bench]]
name = "mode_b_seq_wasm"
harness = false

# Batched-descent MCTS through a real JIT'd guest — the #152 follow-up to the
# Q-5 gate, measuring whether coarsened granularity brings a WASM guest in budget.
[[bench]]
name = "mcts_batched_wasm"
harness = false
