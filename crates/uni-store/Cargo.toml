[package]
name = "uni-store"
description = "Storage layer for Uni graph database - Lance datasets, LSM deltas, and WAL"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["candle-text"]

# Text embeddings using Candle (default)
candle-text = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:dirs"]

# GPU acceleration via CUDA (optional)
candle-cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

# Legacy ONNX-based embeddings (optional)
fastembed = ["dep:fastembed"]

[dependencies]
uni-common = { workspace = true }
uni-crdt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
dashmap = "6.0"
lru = "0.16"
metrics = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = "0.3"
lance = { workspace = true }
lance-index = { version = "1.0.1" }
lance-linalg = { version = "1.0.1" }
lancedb = { workspace = true }
# Embedding providers
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
dirs = { version = "6.0", optional = true }
fastembed = { workspace = true, optional = true }

object_store = { workspace = true }
url = { workspace = true }
sha3 = "0.10.8"

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
