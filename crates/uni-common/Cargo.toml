[package]
name = "uni-common"
description = "Common types, identity encoding, and schema for Uni graph database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
multibase = "0.9"
rustc-hash = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
arrow-schema = { workspace = true }
object_store = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
rmp-serde = "1.3"
ulid = { workspace = true }
uni-btic = { workspace = true }
uni-sparse-vector = { workspace = true }
# Test seams (`fail_point!`): inert unless a dependent enables `fail/failpoints`
# (uni-store's and uni-db's `failpoints` features do, and Cargo unifies the
# feature onto this one `fail` crate).
fail = "0.5"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs", "io-util"] }
