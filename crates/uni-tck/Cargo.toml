[package]
name = "uni-tck"
version.workspace = true
edition = "2021"
license.workspace = true
# Conformance harness, not a published artifact — matches uni-locy-oracle.
publish = false
# Integration tests are consolidated: `tck` is the cucumber runner, everything
# else lives in the `integration` binary. See `docs/test_layout.md`.
autotests = false

[dependencies]
uni-db = { path = "../uni" }
uni-query = { path = "../uni-query" }
uni-common = { path = "../uni-common" }
cucumber = { version = "0.21", features = ["libtest"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
thiserror = "2"
regex = "1.12"
indexmap = "2.14"
nom = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = { workspace = true }

# The openCypher TCK runner. Stays a separate binary because `harness = false`
# means it supplies its own `fn main()` (libtest-mimic over cucumber), which
# cannot host ordinary `#[test]` functions — the same class of exception as
# `uni-store`'s `occ_model` target.
[[test]]
name = "tck"
path = "tests/tck.rs"
harness = false

# Everything else: one binary, one `mod` per repro file.
[[test]]
name = "integration"
path = "tests/integration.rs"

[dev-dependencies]
libtest-mimic = "0.8"
gherkin = "0.14"
