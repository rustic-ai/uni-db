[workspace]
members = [
    "crates/uni-common",
    "crates/uni-store",
    "crates/uni-algo",
    "crates/uni-query",
    "crates/uni-cli",
    "crates/uni",
    "crates/uni-crdt",
    "bindings/uni-db",
    "crates/uni-cypher",
    "crates/uni-tck",
]
# Exclude uni-tck from default builds - run on-demand only
default-members = [
    "crates/uni-common",
    "crates/uni-store",
    "crates/uni-algo",
    "crates/uni-query",
    "crates/uni-cli",
    "crates/uni",
    "crates/uni-crdt",
    "bindings/uni-db",
    "crates/uni-cypher",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Dragonscale Industries Inc. <dev@dragonscale.ai>"]
license = "Apache-2.0"
repository = "https://github.com/rustic-ai/uni"
homepage = "https://www.rustic.ai"
documentation = "https://rustic-ai.github.io/uni"
keywords = ["graph", "database", "cypher", "vector", "embedded"]
categories = ["database", "data-structures"]

[workspace.dependencies]
uni-common = { path = "crates/uni-common" }
uni-store = { path = "crates/uni-store" }
uni-algo = { path = "crates/uni-algo" }
uni-query = { path = "crates/uni-query" }
uni-cli = { path = "crates/uni-cli" }
uni-db = { path = "crates/uni" }
uni-crdt = { path = "crates/uni-crdt" }
uni-cypher = { path = "crates/uni-cypher" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
arrow = { version = "56.2.0", features = ["prettyprint"] }
arrow-array = "56.2.0"
arrow-schema = "56.2.0"
arrow-cast = "56.2.0"
lance = "1.0.1"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive"] }
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
tempfile = "3.10"
uuid = { version = "1.8", features = ["v4"] }
chrono = "0.4.43"
chrono-tz = "0.10"
itertools = "0.12"
fxhash = "0.2"
smallvec = "1.11"
bytes = "1.6"
parking_lot = "0.12"
# Embedding providers - Candle (default) or FastEmbed (optional, ONNX-based)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["onig", "http"] }
hf-hub = { version = "0.4", features = ["tokio"] }
fastembed = { version = "5.6.0", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }
# ort = { version = "=2.0.0-rc.9" }
rand = "0.8"
ordered-float = "4.2"
rayon = "1.10"
csv = "1.3"
parquet = "56.2.0"
regex = "1.10"
lazy_static = "1.4"
async-recursion = "1.1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
rustyline = "13.0"
colored = "2.1"
prettytable-rs = "0.10"
criterion = "0.5"
url = "2.5"
proptest = "1.4"
datafusion = "50.3.0"
lancedb = "0.23.1"
