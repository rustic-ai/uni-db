[workspace]
members = [
    "crates/uni-common",
    "crates/uni-btic",
    "crates/uni-sparse-vector",
    "crates/uni-store",
    "crates/uni-algo",
    "crates/uni-query",
    "crates/uni-query-functions",
    "crates/uni-cli",
    "crates/uni",
    "crates/uni-crdt",
    "bindings/uni-db",
    # Wheel-matrix sibling crates — share `bindings/uni-db/src/lib.rs` via
    # `[lib].path`; differ only in the cargo features they activate. The
    # 6-wheel matrix mirrors uni-xervo 0.9.0's three-axis model
    # (provider × linking × acceleration). See
    # `docs/migrations/0.9.0-wheel-matrix-collapse.md` for the design.
    "bindings/uni-db-onnx",
    "bindings/uni-db-cuda",
    "bindings/uni-db-metal",
    "bindings/uni-db-onnx-cuda",
    "bindings/uni-db-onnx-metal",
    "crates/uni-cypher",
    "crates/uni-tck",
    "crates/uni-locy-tck",
    # Naive-Datalog reference oracle for differential-testing the Locy engine.
    # Excluded from `default-members` (like the *-tck crates) so default/release/
    # doc builds skip it; run explicitly with `-p uni-locy-oracle`.
    "crates/uni-locy-oracle",
    "crates/uni-locy",
    "crates/uni-plugin",
    "crates/uni-plugin-builtin",
    "crates/uni-plugin-apoc-core",
    "crates/uni-plugin-wasm",
    "crates/uni-plugin-wasm-rt",
    "crates/uni-plugin-extism",
    "crates/uni-plugin-rhai",
    "crates/uni-plugin-pyo3",
    "crates/uni-plugin-custom",
    "crates/uni-plugin-conformance",
    "crates/uni-plugin-host",
    "crates/uni-sidecar",
    "crates/uni-bulk",
    "crates/uni-fork",
]
# Exclude uni-tck from default builds - run on-demand only
default-members = [
    "crates/uni-common",
    "crates/uni-btic",
    "crates/uni-sparse-vector",
    "crates/uni-store",
    "crates/uni-algo",
    "crates/uni-query",
    "crates/uni-query-functions",
    "crates/uni-cli",
    "crates/uni",
    "crates/uni-crdt",
    "bindings/uni-db",
    "crates/uni-cypher",
    "crates/uni-locy",
    "crates/uni-plugin",
    "crates/uni-plugin-builtin",
    "crates/uni-plugin-apoc-core",
    "crates/uni-plugin-wasm",
    "crates/uni-plugin-wasm-rt",
    "crates/uni-plugin-extism",
    "crates/uni-plugin-rhai",
    "crates/uni-plugin-pyo3",
    "crates/uni-plugin-custom",
    "crates/uni-plugin-conformance",
    "crates/uni-plugin-host",
    "crates/uni-sidecar",
    "crates/uni-bulk",
    "crates/uni-fork",
]
resolver = "2"

[workspace.package]
version = "4.1.1"
edition = "2024"
# Floor is set by our deps, not by the edition: `lance` declares
# `rust-version = "1.91.0"` and `datafusion` declares `1.88.0`, so 1.91 is the
# lowest toolchain that can actually build this workspace. (Edition 2024 alone
# only needs 1.85, which is what this said before -- a floor the dependency
# graph had already invalidated, so the advertised MSRV did not hold.)
# Keep it pinned so a stale toolchain fails fast with an actionable cargo error
# instead of a parse failure or a mid-build trait error.
rust-version = "1.91"
authors = ["Dragonscale Industries Inc. <dev@dragonscale.ai>"]
license = "Apache-2.0"
repository = "https://github.com/rustic-ai/uni-db"
homepage = "https://www.rustic.ai"
documentation = "https://rustic-ai.github.io/uni-db"
keywords = ["graph", "database", "cypher", "vector", "embedded"]
categories = ["database", "data-structures"]

[workspace.dependencies]
uni-common = { path = "crates/uni-common", version = "4.1.1" }
uni-store = { path = "crates/uni-store", version = "4.1.1" }
uni-algo = { path = "crates/uni-algo", version = "4.1.1" }
uni-query = { path = "crates/uni-query", version = "4.1.1" }
uni-query-functions = { path = "crates/uni-query-functions", version = "4.1.1" }
uni-cli = { path = "crates/uni-cli", version = "4.1.1" }
uni-db = { path = "crates/uni", version = "4.1.1", default-features = false }
uni-crdt = { path = "crates/uni-crdt", version = "4.1.1" }
uni-cypher = { path = "crates/uni-cypher", version = "4.1.1" }
uni-locy = { path = "crates/uni-locy", version = "4.1.1" }
uni-btic = { path = "crates/uni-btic", version = "4.1.1" }
uni-sparse-vector = { path = "crates/uni-sparse-vector", version = "4.1.1" }
uni-plugin = { path = "crates/uni-plugin", version = "4.1.1" }
uni-plugin-builtin = { path = "crates/uni-plugin-builtin", version = "4.1.1" }
uni-plugin-apoc-core = { path = "crates/uni-plugin-apoc-core", version = "4.1.1" }
uni-plugin-wasm = { path = "crates/uni-plugin-wasm", version = "4.1.1" }
uni-plugin-wasm-rt = { path = "crates/uni-plugin-wasm-rt", version = "4.1.1" }
uni-plugin-extism = { path = "crates/uni-plugin-extism", version = "4.1.1" }
uni-plugin-rhai = { path = "crates/uni-plugin-rhai", version = "4.1.1" }
uni-plugin-pyo3 = { path = "crates/uni-plugin-pyo3", version = "4.1.1" }
uni-plugin-custom = { path = "crates/uni-plugin-custom", version = "4.1.1" }
uni-plugin-conformance = { path = "crates/uni-plugin-conformance", version = "4.1.1" }
uni-plugin-host = { path = "crates/uni-plugin-host", version = "4.1.1" }
uni-sidecar = { path = "crates/uni-sidecar", version = "4.1.1" }
uni-bulk = { path = "crates/uni-bulk", version = "4.1.1" }
uni-fork = { path = "crates/uni-fork", version = "4.1.1" }

# LOCK PIN (transitive, not listed here): `time` is held at =0.3.47 in
# Cargo.lock — time 0.3.48 adds `impl From<X> for <X as ModifierValue>::Type`
# impls that fail coherence (E0119) against aws-smithy-types 1.5.0's blanket
# `impl<T> From<T> for CanDisable<T>`. After any blanket `cargo update`, re-run
# `cargo update -p time --precise 0.3.47` until aws-smithy-types ships a fix.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2"
arrow = { version = "58.3.0", features = ["prettyprint"] }
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
arrow-row = "58.3.0"
lance = { version = "11.0.0", default-features = false, features = ["aws", "azure", "gcp"] }
# Pinned here, not in the crate that uses them: `lance-index` and `lance-linalg`
# must move in lockstep with `lance`. Left as bare version strings in
# `crates/uni-store/Cargo.toml` they resolve independently, and a bump of `lance`
# alone still produces a clean lockfile carrying TWO complete lance trees (and
# two datafusions, since lance pins datafusion exactly). That surfaces as
# "expected `RecordBatch`, found `RecordBatch`", never as a version error.
lance-index = { version = "11.0.0" }
lance-linalg = { version = "11.0.0" }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTel API + tracing bridge. These two are a tightly-coupled compatible pair
# (tracing-opentelemetry 0.33 ↔ opentelemetry 0.32); pin them together here so
# every crate shares one version and a bump happens in exactly one place.
opentelemetry = "0.32"
tracing-opentelemetry = "0.33"
arc-swap = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
tempfile = "3.27"
uuid = { version = "1.23", features = ["v4", "serde"] }
semver = "1.0"
blake3 = "1"
cron = "0.16"
ulid = { version = "1.2", features = ["serde"] }
chrono = "0.4.45"
chrono-tz = "0.10"
rustc-hash = "2.1"
bytes = "1.11"
parking_lot = "0.12"
rand = "0.10"
ordered-float = "5"
rayon = "1.12"
csv = "1.4"
parquet = "58.3.0"
regex = "1.12"
metrics = "0.24"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
rustyline = "18"
colored = "3"
prettytable-rs = "0.10"
criterion = "0.8"
url = "2.5"
proptest = "1.11"
datafusion = "54.1.0"
# Floor is 0.18.0, not 0.17.0: `crates/uni` enables `provider-llamacpp` in its
# default features and that feature does not exist before 0.18.0. Our lock pins
# 0.18.0 so the workspace never saw it, but the declared range advertised a
# compatibility that does not hold -- a downstream graph that pinned uni-xervo
# to 0.17.0 got "uni-xervo does not have these features" at build time, and
# `cargo outdated` could not resolve the workspace at all.
uni-xervo = { version = ">=0.18.0, <1.0.0", default-features = false }
biodivine-lib-bdd = "0.6"
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }
hf-hub = "0.5"
tokenizers = "0.23"
